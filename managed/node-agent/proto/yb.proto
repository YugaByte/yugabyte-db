syntax = "proto3";
package nodeagent.server;

option go_package = "./service";
option java_package = "com.yugabyte.yw.nodeagent";
option java_multiple_files = true;

import "common.proto";

message PreflightCheckInput {
    string ybHomeDir = 1;
    bool skipProvisioning = 2;
    bool airGapInstall = 3;
    bool installNodeExporter = 4;
    uint32 sshPort = 5;
    repeated string mountPaths = 6;
    uint32 masterHttpPort = 7;
    uint32 masterRpcPort = 8;
    uint32 tserverHttpPort = 9;
    uint32 tserverRpcPort = 10;
    uint32 redisServerHttpPort = 11;
    uint32 redisServerRpcPort = 12;
    uint32 nodeExporterPort = 13;
    uint32 ycqlServerHttpPort = 14;
    uint32 ycqlServerRpcPort = 15;
    uint32 ysqlServerHttpPort = 16;
    uint32 ysqlServerRpcPort = 17;
    uint32 ybControllerHttpPort = 18;
    uint32 ybControllerRpcPort = 19;
}

message PreflightCheckOutput {
    repeated NodeConfig nodeConfigs = 1;
}

message NodeConfig {
    string type = 1;
    string value = 2;
}


enum Service {
    EARLYOOM = 0;
}

message GetServiceStateRequest {
    Service service = 1;
}

message EarlyoomState {
    int32 kills_last_hour = 1;
    int32 total_kills = 2;
}

message GetServiceStateResponse {
    bool enabled = 1;
    oneof state {
        EarlyoomState earlyoomState = 2;
    }
}

message EarlyoomConfig {
    optional string startArgs = 1;
}

message ServiceConfig {
    optional string ybHomeDir = 1;
    oneof data {
        EarlyoomConfig earlyoomConfig = 2;
    }
}

message ConfigureServiceInput {
    Service service = 1;
    bool enabled = 2;
    optional ServiceConfig config = 3;
}

message ConfigureServiceOutput {
    Service service = 1;
    bool success = 2;
    optional Error error = 3;
}

enum ServerControlType {
    START = 0;
    STOP = 1;
}

message ServerControlInput {
    ServerControlType controlType = 1;
    string serverName = 2;
    string serverHome = 3;
    bool deconfigure = 4;
    // When true, run the CSP /mnt/dN data-volume attachment check.
    bool checkDataVolumes = 5;
    // Absolute mount paths to wait for / verify before START (cloud: /mnt/dN).
    repeated string mountPoints = 6;
}

message ServerControlOutput {
    int32 pid = 1;
}

message InstallSoftwareInput {
    string ybPackage = 1;
    string remoteTmp = 2;
    string ybHomeDir = 3;
    repeated string symLinkFolders = 4;
}

message InstallSoftwareOutput {
    int32 pid = 1;
}

message DownloadSoftwareInput {
    string ybPackage = 1;
    bool s3RemoteDownload = 2;
    string awsAccessKey = 3;
    string awsSecretKey = 4;
    bool gcsRemoteDownload = 5;
    string gcsCredentialsJson = 6;
    bool httpRemoteDownload = 7;
    string httpPackageChecksum = 8;
    string iTestS3PackagePath = 9;
    string remoteTmp = 10;
    string ybHomeDir = 11;
    uint32 numReleasesToKeep = 12;
}

message DownloadSoftwareOutput {
    int32 pid = 1;
}

message ServerGFlagsInput {
    map<string, string> gflags = 1;
    string serverName = 2;
    string serverHome = 3;
    bool resetMasterState = 4;
}

message ServerGFlagsOutput {
}

message InstallYbcInput {
    string ybcPackage = 1;
    string remoteTmp = 2;
    string ybHomeDir = 3;
    repeated string mountPoints = 4;
}

message InstallYbcOutput {
    int32 pid = 1;
}

message ConfigureServerInput {
    string remoteTmp = 1;
    string ybHomeDir = 2;
    repeated string processes = 3;
    repeated string mountPoints = 4;
    uint32 numCoresToKeep = 5;
    bool configureCgroup = 6;
    optional bool acceptableClockSkewWaitEnabled = 7;
    optional double acceptableClockSkewSec = 8;
    optional uint32 acceptableClockSkewMaxTries = 9;
    // When true, bake the CSP /mnt/dN data-volume attachment check into scripts.
    bool checkDataVolumes = 10;
}

message ConfigureServerOutput {
    int32 pid = 1;
}

message InstallOtelCollectorInput {
    string ybHomeDir = 1;
    repeated string mountPoints = 2;
    string otelColPackagePath = 3;
    string ycqlAuditLogLevel = 4;
    string otelColConfigFile = 5;
    string otelColAwsAccessKey = 6;
    string otelColAwsSecretKey = 7;
    string otelColGcpCredsFile = 8;
    string remoteTmp = 9;
    uint32 otelColMaxMemory = 10;
    // Days to keep extracted YSQL audit log archives on the node. 0 = disabled.
    uint32 ysqlAuditLogRetentionDays = 11;
    // Days to keep gzipped YCQL audit log archives on the node. 0 = disabled.
    uint32 ycqlAuditLogRetentionDays = 12;
    // When true, skip the heavy otel-collector install steps (package
    // upload/untar, service unit placement) and only rewrite the audit-log
    // cleanup env file + refresh the on-node zip_purge_yb_logs.sh script.
    // Used to propagate audit-log setting changes even when otel-collector
    // is not being (re)installed.
    bool refreshScriptOnly = 13;
    // POSIX-ERE record-start pattern for YSQL logs, derived from the universe's
    // log_line_prefix (the same source the collector's multiline config uses).
    // zip_purge_yb_logs.sh needs it to group multi-line audit statements into
    // whole records when archiving; empty falls back to the script's default.
    string ysqlAuditLineStartRegex = 14;
}

message InstallOtelCollectorOutput {
    int32 pid = 1;
}

// Input to set up cross-cloud federated IAM on a DB node, so YBC can reach backup
// storage in a cloud the node does not run on, using the node's own identity.
message ConfigureCloudFederationInput {
    // Clouds are named individually rather than as one direction enum: a direction is an
    // ordered pair, so enumerating them grows with the square of the number of clouds,
    // while this grows with the number of clouds.
    enum CloudProvider {
        CLOUD_PROVIDER_UNSPECIFIED = 0;
        AWS = 1;
        GCP = 2;
    }
    // Cloud this node runs on. For an on-prem provider YBA detects it from the node's
    // metadata service; it is not the provider type.
    CloudProvider sourceCloud = 1;
    // Cloud the backup storage lives in. Always differs from sourceCloud: same-cloud
    // access is native and needs no federation. Both are unset when enabled is false.
    CloudProvider targetCloud = 8;
    string ybHomeDir = 2;
    // When false, federation artifacts on this node are torn down.
    bool enabled = 3;
    // Air-gapped node: skip package downloads, fail fast if a tool is missing.
    bool isAirgap = 4;
    // Writable temp dir provided by YBA (some nodes have a non-writable /tmp).
    string remoteTmp = 7;
    // Settings for targetCloud.
    oneof config {
        GcsConfig gcs = 5;
        S3Config s3 = 6;
    }
}

// GCP Workload Identity Federation audience for a node writing to GCS. The node
// renders the full external_account JSON from this audience; the rest of the
// credential (type, token_url, credential_source) is fixed in the
// gcp-fed-creds.json.j2 template. The audience comes from the provider config.
message GcsConfig {
    string audience = 1;
}

// Params for a GCP node writing to S3 via AWS AssumeRoleWithWebIdentity. The node
// renders aws_credential_process.sh (which exchanges the GCE identity token for the
// audience against STS) and an ~/.aws/config credential_process profile. All three
// values come from the provider's federated-IAM config; profileName is a fixed
// internal name YBC references via AWS_PROFILE.
message S3Config {
    string roleArn = 1;
    string audience = 2;
    string profileName = 3;
}
message ConfigureCloudFederationOutput {
    // True if the handler (re)wrote artifacts and restarted YBC; false on a no-op reconcile.
    bool changed = 1;
    // Human-readable reason, e.g. "creds drift" or "already configured".
    string detail = 2;
}

// Input to point node_exporter's web config at the node's TLS certificate (or at nothing, for
// plain HTTP) and make the running exporter serve that scheme.
message ConfigureNodeExporterInput {
    string ybHomeDir = 1;
    uint32 nodeExporterPort = 2;
    bool tlsEnabled = 3;
    // Server certificate and key; required when tlsEnabled is true.
    string certFile = 4;
    string keyFile = 5;
}

message ConfigureNodeExporterOutput {
    // Scheme the exporter serves when the task returns: "http" or "https".
    string scheme = 1;
    // True if the task restarted the exporter to switch schemes.
    bool restarted = 2;
}

message SetupCGroupInput {
    string ybHomeDir = 1;
    uint32 pgMaxMemMb = 2;
}

message SetupCGroupOutput {
    int32 pid = 1;
}

message DestroyServerInput {
    string ybHomeDir = 1;
    bool isProvisioningCleanup = 2;
}

message DestroyServerOutput {
}

message YnpPreflightCheckInput {
    string configJson = 1;
    string remoteTmp = 2;
}

message YnpPreflightCheckOutput {
    uint32 exitCode = 1;
    string output = 2;
}

message RotateSshKeyInput {
    string remoteTmp = 1;
    string sshUser = 2;
    string oldPublicKeyContent = 3;
    string newPublicKeyContent = 4;
}

message RotateSshKeyOutput {
}

// YugabyteProcessRole identifies a YugabyteDB related process on the node.
enum YugabyteProcessRole {
    YB_ROLE_UNKNOWN = 0;
    YB_ROLE_MASTER = 1;
    YB_ROLE_TSERVER = 2;
    YB_ROLE_CONTROLLER = 3;
    YB_ROLE_POSTGRES = 4;
    YB_ROLE_NODE_EXPORTER = 5;
}

// ProcessListener is a single listening socket classified to a role when known.
message ProcessListener {
    uint32 port = 1;
    string protocol = 2;
    int32 pid = 3;
    YugabyteProcessRole role = 4;
    string processName = 5;
}

// ProcessArg is a single key-value argument. Sensitive values are redacted.
message ProcessArg {
    string key = 1;
    string value = 2;
    // Source is one of "cmdline", "flagfile" or "merged".
    string source = 3;
}

// ProcessConfig carries the flagfile and parsed arguments for a process. It is
// only populated for master, tserver and controller when the process is running.
message ProcessConfig {
    string flagfilePath = 1;
    bool flagfileExists = 2;
    bool flagfileReadable = 3;
    repeated ProcessArg cmdlineArgs = 4;
    repeated ProcessArg flagfileArgs = 5;
    // Merged effective arguments (flagfile overlaid by cmdline).
    repeated ProcessArg args = 6;
}

// ProcessStatus is the detected status of a single role.
message ProcessStatus {
    YugabyteProcessRole role = 1;
    bool running = 2;
    // Primary pid when multiple processes match the role.
    int32 pid = 3;
    repeated uint32 listenPorts = 4;
    repeated ProcessListener listeners = 5;
    ProcessConfig config = 6;
}

message CheckYugabyteDbStatusRequest {
}

message CheckYugabyteDbStatusResponse {
    bool masterPresent = 1;
    bool tserverPresent = 2;
    bool controllerPresent = 3;
    bool postgresPresent = 4;
    bool nodeExporterPresent = 5;
    repeated ProcessStatus processes = 6;
    // Listeners classified as YugabyteDB processes on non-default ports.
    repeated ProcessListener otherListeners = 7;
}

message HealthCheckInput {
    // Opaque id for this schedule configuration. Changing it forces a reschedule.
    string generation_id = 1;
    string yb_home_dir = 2;
    int32 schedule_interval_sec = 3;
    int32 run_timeout_sec = 4;
    int32 idle_timeout_sec = 5;
    bool ddl_atomicity_check = 6;
    string master_leader_url = 7;
    string yba_ynp_version = 8;
    // Earliest acceptable end_epoch_secs for a cached result. Set once per YBA
    // health cycle (typically cycle_start - schedule_interval) so every node
    // returns a result from the same window, or waits for the next tick.
    int64 min_result_epoch_secs = 9;
}

message HealthCheckOutput {
    // Same as HealthCheckInput.generation_id for the schedule that produced this result.
    string generation_id = 1;
    string report_json = 2;
    int64 start_epoch_secs = 3;
    int64 end_epoch_secs = 4;
    optional Error error = 5;
}
